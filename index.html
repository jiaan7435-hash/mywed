*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow-x:hidden;font-family:system-ui,"PingFang SC",sans-serif;background:#050710;color:#d8e8f5;position:relative}
#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.cursor-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,220,0.18),transparent 65%);filter:blur(10px);pointer-events:none}
nav{position:sticky;top:0;z-index:99;background:rgba(10,14,24,0.65);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.08)}
.nav-wrap{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
nav a{position:relative;padding:9px 18px;border-radius:100px;text-decoration:none;color:#a0b4cc;font-size:15px;background:rgba(255,255,255,0.05);transition:.25s}
nav a.active,nav a:hover{color:#00ffdc;background:rgba(0,255,220,0.12)}
.badge{position:absolute;top:-8px;right:-14px;background:#ff4d4f;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.main{position:relative;z-index:1;width:100%;max-width:1080px;margin:0 auto;padding:60px 20px;display:grid;gap:30px}
.main-card{background:rgba(20,28,42,0.46);border-radius:24px;padding:28px;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);overflow:visible}
.banner{width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);margin-bottom:24px}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center}
.avatar-box{width:140px;height:140px;margin:-70px auto 20px;position:relative;z-index:3;overflow:visible}
.avatar-box img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center;border:2px solid rgba(255,255,255,0.4);box-shadow:0 0 4px rgba(0,255,220,0.3),0 10px 30px rgba(0,0,0,0.4)}
.rotate-ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(0,255,220,0.3);animation:rotate 10s linear infinite}
@keyframes rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.info-text{text-align:center;margin-bottom:10px}
.info-text h1{font-size:28px;font-weight:700;color:#fff}
.sub-title{color:#8fb8d8;margin:14px 0;max-width:700px;margin-left:auto;margin-right:auto}
.online-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;background:rgba(0,255,220,0.08);border-radius:999px;margin-bottom:22px}
.dot{width:8px;height:8px;border-radius:50%;background:#00ffdc;animation:blink 1.7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.intro-text{padding:20px;border-radius:18px;border:1px solid rgba(0,255,220,0.08);background:rgba(28,38,54,0.4);line-height:1.8;color:#b8d2e8;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat-item{padding:18px;border-radius:16px;background:rgba(255,255,255,0.04);text-align:center;transition:0.25s}
.stat-item:hover{border-color:rgba(0,255,220,0.3);transform:translateY(-4px)}
.stat-item b{display:block;font-size:24px;color:#00ffdc;margin-bottom:4px}
.stat-item span{color:#90a6bc;font-size:14px}
.guestbook-title{font-size:18px;font-weight:700;color:#b8dff8;letter-spacing:1px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08)}
</style>
