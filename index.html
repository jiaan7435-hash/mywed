<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>暖阳 · 个人空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow-x:hidden;font-family:system-ui,"PingFang SC",sans-serif;background:#050710;color:#d8e8f5;position:relative}
#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.cursorGlow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,220,0.18),transparent 65%);filter:blur(10px);pointer-events:none;z-index:1;transform:translate(-50%,-50%)}
nav{position:sticky;top:0;z-index:99;background:rgba(10,14,24,0.65);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.1);box-shadow:0 4px 20px rgba(0,0,0,0.25)}
.nav-wrap{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
nav a{padding:9px 18px;border-radius:14px;text-decoration:none;color:#a0b4cc;font-size:15px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);transition:0.25s;position:relative}
nav a.active,nav a:hover{color:#00ffdc;background:rgba(0,255,220,0.12);border-color:rgba(0,255,220,0.35);box-shadow:0 0 16px rgba(0,255,220,0.15)}
.badge{position:absolute;top:-6px;right:-6px;background:#ff4466;color:#fff;font-size:10px;padding:2px 6px;border-radius:99px}
.main-card{--mx:50%;--my:50%;position:relative;z-index:2;width:calc(100% - 36px);max-width:680px;margin:50px auto 30px;padding:26px 32px 42px;border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,0.12),rgba(255,255,255,0.03));backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,0.16);box-shadow:0 20px 60px rgba(0,0,0,0.4);overflow:hidden}
.main-card::after{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx) var(--my),rgba(255,255,255,0.22),transparent 65%);opacity:0;transition:0.3s;pointer-events:none}
.main-card:hover::after{opacity:1}
.banner{width:100%;height:200px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.2);margin-bottom:24px}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform 7s ease}
.main-card:hover .banner img{transform:scale(1.07)}
.avatar-box{width:140px;height:140px;margin:-80px auto 20px;position:relative;z-index:3}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center;border:2px solid rgba(255,255,255,0.4);box-shadow:0 0 0 4px rgba(0,255,220,0.12),0 10px 30px rgba(0,255,220,0.28)}
.rotate-ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(0,255,220,0.3);animation:rotate 16s linear infinite}
@keyframes rotate{100%{transform:rotate(360deg)}}
h1{font-size:36px;letter-spacing:3px;margin-bottom:10px}
.gradient-text{background:linear-gradient(90deg,#ffffff,#00ffdc,#8866ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(0,255,220,0.35))}
.sub-title{color:#9cf8ec;font-family:Consolas,monospace;font-size:14px;margin-bottom:20px}
.online-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);margin-bottom:22px;font-size:13px;color:#c4fff7}
.point{width:8px;height:8px;border-radius:50%;background:#00ffdc;box-shadow:0 0 10px #00ffdc;animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.intro{padding:20px;border-radius:18px;border-left:3px solid #00ffdc;background:rgba(255,255,255,0.04);line-height:1.8;color:#b8d2e8;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.stat-item{padding:16px 8px;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;transition:0.25s}
.stat-item:hover{transform:translateY(-4px);border-color:#00ffdc}
.stat-item b{display:block;font-size:14px;color:#eafffb}
.stat-item span{font-size:11px;color:#93a0ae;margin-top:4px;display:block}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:13px 30px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;color:#021a15;background:linear-gradient(90deg,#00ffdc,#7c5cff);box-shadow:0 0 20px rgba(0,255,220,0.2);transition:0.22s}
.btn.ghost{background:rgba(255,255,255,0.08);color:#c4fff7;border:1px solid rgba(255,255,255,0.2)}
.btn:hover{transform:translateY(-2px)}
.guestbook{width:calc(100% - 36px);max-width:680px;margin:0 auto 60px;padding:26px 22px;border-radius:26px;background:linear-gradient(165deg,rgba(255,255,255,.12),rgba(255,255,255,.025));backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 20px 50px rgba(0,0,0,.4);position:relative;z-index:2}
.guestbook-title{font-size:15px;font-weight:700;color:#d9fff8;letter-spacing:2px;margin-bottom:16px;padding-left:12px;
