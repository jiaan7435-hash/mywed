<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖阳 · 个人空间</title>
    <style>
        /* ================= 基础重置与背景 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #dbe4ee;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: 
                radial-gradient(1200px 700px at 12% -10%, rgba(0, 255, 204, .16), transparent 62%),
                radial-gradient(1000px 600px at 92% 112%, rgba(124, 92, 255, .2), transparent 62%),
                linear-gradient(165deg, #04060b, #0a1018 50%, #04060a);
        }

        #bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glow {
            position: fixed;
            width: 440px;
            height: 440px;
            margin: -220px 0 0 -220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 204, .14), rgba(124, 92, 255, .09) 45%, transparent 72%);
            filter: blur(8px);
            pointer-events: none;
            z-index: 1;
        }

        /* ================= 导航栏 ================= */
        nav {
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .02));
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            box-shadow: 0 1px 0 rgba(255, 255, 255, .22) inset, 0 12px 40px rgba(0, 0, 0, .35);
        }

        .nav-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: #93a0ae;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 17px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .01));
            box-shadow: 0 1px 0 rgba(255, 255, 255, .16) inset;
            transition: .28s;
        }

        nav a:hover, nav a.active {
            color: #eafffb;
            background: linear-gradient(180deg, rgba(0, 255, 204, .2), rgba(0, 255, 204, .06));
            border-color: rgba(0, 255, 204, .45);
            box-shadow: 0 1px 0 rgba(255, 255, 255, .4) inset, 0 0 24px rgba(0, 255, 204, .28);
        }

        /* ================= 核心卡片样式 ================= */
        .card {
            --mx: 50%;
            --my: 0%;
            position: relative;
            z-index: 2;
            max-width: 660px;
            width: calc(100% - 36px);
            margin: 54px auto 24px;
            padding: 46px 36px 40px;
            text-align: center;
            border-radius: 32px;
            overflow: hidden;
            background: linear-gradient(160deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05) 34%, rgba(255, 255, 255, .015) 62%, rgba(255, 255, 255, .08)), rgba(12, 18, 28, .34);
            backdrop-filter: blur(28px) saturate(190%) brightness(1.06);
            -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(1.06);
            border: 1px solid rgba(255, 255, 255, .2);
            box-shadow: 0 1px 0 rgba(255, 255, 255, .42) inset, 0 -1px 0 rgba(255, 255, 255, .1) inset, 0 28px 70px rgba(0, 0, 0, .55), 0 0 80px rgba(0, 255, 204, .09);
            transition: transform .12s ease-out;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85) 30%, rgba(0, 255, 204, .7) 60%, transparent);
            filter: blur(.4px);
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(255, 255, 255, .3), rgba(255, 255, 255, .1) 34%, transparent 64%);
            opacity: 0;
            transition: opacity .35s;
            pointer-events: none;
            mix-blend-mode: screen;
        }

            opacity: 1;
